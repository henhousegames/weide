# Deploys the committed site/ directory (built locally with `weide deploy`) to GitHub Pages.
# Inactive until the repository's Pages source is set to "GitHub Actions" (see docs/DEPLOY.md).
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # only after the rename: pushes to the old repo never run a (failing) Pages deploy
    if: github.repository == 'henhousegames/henhouse'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a built site
        run: test -f site/index.html || { echo "site/index.html missing: run 'uv run weide deploy' and commit site/"; exit 1; }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
